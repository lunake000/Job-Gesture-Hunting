<body><div class="grain"></div><div class="orb one"></div><div class="orb two"></div><main>
  <header><div class="brand">毕业季 · 职业预言局</div><div class="badge">02 / 手势模式</div></header>

  <div><div class="camera-shell" id="cameraShell"><video id="video" autoplay playsinline muted></video><canvas class="trail" id="trail"></canvas><button class="camera-start" id="startCamera"><span>📷</span><strong>开启镜头，开始预测</strong><small>仅用于识别你的挥手动作</small></button><div class="status"><span id="statusText">等待开启摄像头</span><span class="dot"></span></div></div>

<script type="module">
import { FilesetResolver, HandLandmarker } from './vendor/mediapipe/vision_bundle.mjs';
const careers=[['🎨','体验设计师','你擅长把模糊的感受，变成人人都愿意靠近的好体验。','洞察用户需求，设计产品与服务的使用流程。适合培养视觉表达、调研、原型设计和沟通能力。'],['🌍','可持续发展顾问','你关心世界怎么变得更好，也能把理想拆解成可执行的下一步。','帮助组织把环境与社会目标变成行动方案。可关注环境科学、商业分析、政策与项目管理。'],['💡','产品经理','你总能发现“如果这样会不会更好”。把问题连接成机会，就是你的拿手好戏。','协调设计、技术与业务团队，把用户问题变成可落地的产品。建议练习需求分析、表达和项目推进。'],['🎬','内容创意人','你的脑袋像一间不停开灯的工作室，擅长让平常的故事变得令人难忘。','用文字、影像或互动内容传递观点。作品集、叙事能力和对受众的理解是重要起点。'],['🧠','AI 应用探索者','你不只会使用新工具，还会问出好问题，创造人和技术协作的新方式。','把人工智能工具带进真实场景，创造更聪明的工作流。可从提示设计、基础编程和行业知识开始。'],['📊','数据分析师','你喜欢从杂乱信息里看出规律，并把它讲成清楚的故事。','通过数据发现问题、验证假设并支持决策。统计思维、SQL、可视化和业务理解都很有价值。'],['🤝','用户研究员','你善于倾听，也总能问到关键的那一句。','通过访谈、观察和测试理解真实用户。心理学、社会学、研究方法与沟通能力是优势。'],['🚀','创业运营者','你享受从零到一，把散乱的资源组织成一次漂亮的起飞。','推动项目落地、建立流程并持续解决新问题。适合锻炼组织、商业判断与抗压能力。'],['🧬','科学传播者','你能把复杂知识讲得有趣又有用，让更多人愿意靠近科学。','连接科学、媒体与公众。可积累写作、演讲、内容制作和专业领域知识。'],['🎮','互动体验策划','你关心参与感，想让每一次点击、探索和反馈都充满乐趣。','设计活动、游戏或数字体验的互动机制。可发展用户洞察、叙事、策划和基础技术能力。']];
const video=document.querySelector('#video'), shell=document.querySelector('#cameraShell'), status=document.querySelector('#statusText'), card=document.querySelector('#card'), result=document.querySelector('#result'), trail=document.querySelector('#trail'), trailCtx=trail.getContext('2d'), detail=document.querySelector('#detail');
let handLandmarker, tracking=false, lastVideoTime=-1, swipePreviousX=null, swipeDistance=0, swipeLastMoveAt=0, trailPoints=[], careerOrder=[], careerIndex=-1, blockedUntil=0, targetOffset=0, renderedOffset=0, lastHandAt=0, handTargetX=null, handTargetY=null, cursorX=null, cursorY=null, lastCursorX=null, lastSeenAt=0, cursorOpacity=0, thumbStartedAt=0, thumbOpened=false, thumbArmed=true;
function sizeTrail(){const r=shell.getBoundingClientRect(),dpr=window.devicePixelRatio||1;trail.width=r.width*dpr;trail.height=r.height*dpr;trailCtx.setTransform(dpr,0,0,dpr,0,0)}
function paintTrail(now){const r=shell.getBoundingClientRect();trailCtx.clearRect(0,0,r.width,r.height);trailPoints=trailPoints.filter(p=>now-p.t<560);trailCtx.globalAlpha=cursorOpacity;if(trailPoints.length>2){for(let layer=0;layer<3;layer++){trailCtx.beginPath();trailPoints.forEach((p,i)=>{const age=(now-p.t)/560,fade=Math.max(0,1-age),offset=Math.sin(i*.85+layer*2.1)*((i/trailPoints.length)*9+2);const x=p.x,y=p.y+offset;if(i===0)trailCtx.moveTo(x,y);else trailCtx.lineTo(x,y);if(i===trailPoints.length-1){trailCtx.strokeStyle=layer===0?`rgba(255,231,118,${fade*.9})`:layer===1?`rgba(103,236,255,${fade*.55})`:`rgba(255,113,91,${fade*.42})`;trailCtx.lineWidth=layer===0?3:1.3;trailCtx.lineCap='round';trailCtx.shadowColor=layer===0?'#fff4a4':'#6be6ff';trailCtx.shadowBlur=layer===0?18:9;trailCtx.stroke()}})}const last=trailPoints[trailPoints.length-1];for(let s=0;s<7;s++){const a=s*2.4+now*.006,dist=12+s*5,age=(now-last.t)/560;trailCtx.fillStyle=`rgba(255,${190+s*7},100,${Math.max(0,.55-age)})`;trailCtx.beginPath();trailCtx.arc(last.x+Math.cos(a)*dist,last.y+Math.sin(a)*dist*.45,1.5,0,Math.PI*2);trailCtx.fill()}}trailCtx.globalAlpha=1;trailCtx.shadowBlur=0;requestAnimationFrame(paintTrail)}
function setHandTarget(rawX,rawY,now){const r=shell.getBoundingClientRect();handTargetX=(96-rawX)/96*r.width;handTargetY=rawY/60*r.height;lastSeenAt=now;cursorOpacity=1}
function animateHand(now){const isRecent=now-lastSeenAt<260;if(isRecent&&handTargetX!==null){if(cursorX===null){cursorX=handTargetX;cursorY=handTargetY;lastCursorX=cursorX}else{const dx=handTargetX-cursorX,dy=handTargetY-cursorY,dist=Math.hypot(dx,dy),alpha=Math.min(.42,.28+dist*.009);cursorX+=dx*alpha;cursorY+=dy*alpha;const moveX=cursorX-lastCursorX;targetOffset=Math.max(-112,Math.min(112,targetOffset+moveX*.9));lastCursorX=cursorX;lastHandAt=now}trailPoints.push({x:cursorX,y:cursorY,t:now});if(trailPoints.length>34)trailPoints.shift()}else if(now-lastSeenAt>260){cursorOpacity=Math.max(0,cursorOpacity-.045)}requestAnimationFrame(animateHand)}
function animateCard(now){if(now-lastHandAt>150)targetOffset*=.86;renderedOffset+=(targetOffset-renderedOffset)*.28;const active=result.classList.contains('show')?result:card;if(!result.classList.contains('exit')){const tilt=result.classList.contains('show')?-2:0,energy=Math.abs(renderedOffset);active.style.transform=`translateX(${renderedOffset}px) rotate(${tilt+renderedOffset*.025}deg) scale(1)`;active.style.boxShadow=`${7+energy*.035}px ${8+energy*.03}px 0 #18253a, 0 0 ${energy*.22}px rgba(255,209,102,${Math.min(.45,energy/250)})`}requestAnimationFrame(animateCard)}
function resetGesture(){swipePreviousX=null;swipeDistance=0;trailPoints=[];targetOffset=0;renderedOffset=0;handTargetX=null;handTargetY=null;cursorX=null;cursorY=null;lastCursorX=null;cursorOpacity=0;thumbStartedAt=0;thumbOpened=false;thumbArmed=true;lastVideoTime=-1}
function reveal(){if(performance.now()<blockedUntil)return;if(careerIndex>=careerOrder.length-1){tracking=false;status.textContent='所有职业已探索完成';counter.textContent='职业清单完成';job.textContent='未来由你定义';desc.textContent='这 10 张职业卡已全部解锁。把感兴趣的方向记下来，去探索真实的可能性。';icon.textContent='✨';return}tracking=false;blockedUntil=performance.now()+720;careerIndex++;const c=careerOrder[careerIndex];const update=()=>{resetGesture();icon.textContent=c[0];job.textContent=c[1];desc.textContent=c[2];counter.textContent=`职业结果 ${String(careerIndex+1).padStart(2,'0')} / ${careerOrder.length}`;status.textContent='继续向左挥手，遇见下一个职业';result.style.transform='';result.classList.remove('exit');result.classList.add('show');setTimeout(()=>{tracking=true},430)};if(result.classList.contains('show')){result.classList.add('exit');setTimeout(update,280)}else{card.style.transform='translateX(-150%) rotate(-18deg)';card.style.opacity='0';setTimeout(update,150)}}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angle(a,b,c){const ab={x:a.x-b.x,y:a.y-b.y},cb={x:c.x-b.x,y:c.y-b.y};return Math.acos(Math.max(-1,Math.min(1,(ab.x*cb.x+ab.y*cb.y)/(Math.hypot(ab.x,ab.y)*Math.hypot(cb.x,cb.y)))))*180/Math.PI}
function fingerCurled(l,mcp,pip,tip){const wrist=l[0],jointAngle=angle(l[mcp],l[pip],l[tip]),tipNearPalm=distance(l[tip],wrist)<distance(l[pip],wrist)*1.22;return jointAngle<165&&tipNearPalm}

function isThumbsUp(l){const width=palmWidth(l),palmHeight=distance(l[0],l[9]),thumbDX=Math.abs(l[4].x-l[2].x),thumbDY=l[2].y-l[4].y,thumbLong=distance(l[4],l[2])>palmHeight*.65,thumbHigh=l[0].y-l[4].y>palmHeight*.28&&thumbDY>palmHeight*.35,thumbVertical=thumbDY>thumbDX*.8,thumbStraight=angle(l[2],l[3],l[4])>115,foldedCount=[[5,6,8],[9,10,12],[13,14,16],[17,18,20]].filter(([m,p,t])=>fingerCurled(l,m,p,t)).length;return width>0&&thumbLong&&thumbHigh&&thumbVertical&&thumbStraight&&foldedCount>=3}
function openDetail(){const c=careerOrder[careerIndex];if(!c||detail.classList.contains('show'))return;tracking=false;thumbOpened=true;detailJob.textContent=c[1];detailText.textContent=c[3];detail.classList.add('show');status.textContent='已展开职业详情'}
function detectHands(now){if(handLandmarker&&tracking&&!detail.classList.contains('show')&&now>=blockedUntil&&video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;const data=handLandmarker.detectForVideo(video,now);const rightIndex=data.handedness.findIndex(h=>h?.[0]?.categoryName==='Right');if(rightIndex>=0){const l=data.landmarks[rightIndex],palmX=(l[0].x+l[5].x+l[17].x)/3,palmY=(l[0].y+l[5].y+l[17].y)/3,screenX=1-palmX,thumbsUp=isThumbsUp(l);setHandTarget(palmX,palmY,now);if(swipePreviousX!==null){const step=swipePreviousX-screenX;if(step>.004){swipeDistance+=step;swipeLastMoveAt=now}else if(step<-.003){swipeDistance=Math.max(0,swipeDistance+step*.45)}if(swipeDistance>.18&&now-swipeLastMoveAt<600){status.textContent='右手左滑已捕捉！';reveal()}}swipePreviousX=screenX;if(!thumbsUp){thumbStartedAt=0;thumbArmed=true}if(result.classList.contains('show')&&!thumbOpened&&thumbArmed&&thumbsUp){if(!thumbStartedAt)thumbStartedAt=now;const held=now-thumbStartedAt;if(held>=350){openDetail()}else status.textContent=`标准点赞保持中 · ${Math.ceil((350-held)/10)/100}s`}else if(result.classList.contains('show')){status.textContent=thumbArmed?'右手左滑继续探索 · 标准点赞查看详情':'请先松开点赞，再次标准点赞'}else{status.textContent='追踪右手 · 向左滑动'}}else{swipePreviousX=null;swipeDistance=Math.max(0,swipeDistance-.015);thumbStartedAt=0;status.textContent='请将右手放入镜头'}}requestAnimationFrame(detectHands)}

async function startCamera(){try{status.textContent='正在加载本地右手识别…';handLandmarker=await loadHandModel();const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();careerOrder=[...careers].sort(()=>Math.random()-.5);sizeTrail();shell.classList.add('ready');status.textContent='请将右手放入镜头';tracking=true;requestAnimationFrame(detectHands);requestAnimationFrame(animateHand);requestAnimationFrame(paintTrail);requestAnimationFrame(animateCard)}catch(e){console.error(e);status.textContent='无法启用本地手势识别，请允许摄像头权限';document.querySelector('#startCamera').style.display='flex';}}
